name: Build and upload iOS App Store

on:
  workflow_dispatch:
    inputs:
      upload_to_app_store:
        description: Upload the exported IPA to App Store Connect
        required: true
        default: true
        type: boolean

concurrency:
  group: ios-app-store-build
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 60

    env:
      BUNDLE_ID: com.jiahuichen.littlecolorist
      DEVELOPMENT_TEAM: TX65SX7Y23
      PROFILE_SPECIFIER: Little Colorist iOS App Store Universal
      VERSION: "1.0"
      BUILD_NUMBER: "1"

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Import Apple Distribution certificate
        env:
          CERTIFICATE_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          CERTIFICATE_PATH="$RUNNER_TEMP/distribution.p12"

          printf '%s' "$CERTIFICATE_BASE64" | base64 -D > "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" \
            -k "$KEYCHAIN_PATH" \
            -P "$CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      - name: Install provisioning profile
        env:
          PROFILE_GZIP_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_GZIP_BASE64 }}
        run: |
          set -euo pipefail
          PROFILE_PATH="$RUNNER_TEMP/LittleColorist.mobileprovision"
          PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"

          printf '%s' "$PROFILE_GZIP_BASE64" | base64 -D | gunzip > "$PROFILE_PATH"
          mkdir -p "$PROFILE_DIR"
          cp "$PROFILE_PATH" "$PROFILE_DIR/LittleColorist.mobileprovision"
          file "$PROFILE_PATH"
          wc -c "$PROFILE_PATH"

      - name: Archive iOS app
        run: |
          set -euo pipefail
          xcodebuild \
            -project LittleColorist.xcodeproj \
            -scheme LittleColorist-iOS \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/LittleColorist.xcarchive" \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            DEVELOPMENT_TEAM="$DEVELOPMENT_TEAM" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY='iPhone Distribution' \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_SPECIFIER" \
            OTHER_CODE_SIGN_FLAGS='--timestamp' \
            clean archive

      - name: Export App Store IPA
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/export"
          xcodebuild \
            -exportArchive \
            -archivePath "$RUNNER_TEMP/LittleColorist.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist .github/ios/ExportOptions.plist \
            -allowProvisioningUpdates

      - name: Verify IPA
        run: |
          set -euo pipefail
          APP_PATH="$RUNNER_TEMP/LittleColorist.xcarchive/Products/Applications/小小涂色家.app"
          test -d "$APP_PATH"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          BUNDLE_ID_ACTUAL="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP_PATH/Info.plist")"
          test "$BUNDLE_ID_ACTUAL" = "$BUNDLE_ID"
          find "$RUNNER_TEMP/export" -maxdepth 1 -name '*.ipa' -print

      - name: Upload IPA as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: LittleColorist-iOS-${{ env.VERSION }}-${{ env.BUILD_NUMBER }}
          path: ${{ runner.temp }}/export/*.ipa
          if-no-files-found: error
          retention-days: 7

      - name: Upload IPA to App Store Connect
        if: ${{ inputs.upload_to_app_store }}
        env:
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          ASC_API_PRIVATE_KEY_BASE64: ${{ secrets.ASC_API_PRIVATE_KEY_BASE64 }}
        run: |
          set -euo pipefail
          API_KEY_DIR="$HOME/.appstoreconnect/private_keys"
          API_KEY_PATH="$API_KEY_DIR/AuthKey_${ASC_API_KEY_ID}.p8"
          mkdir -p "$API_KEY_DIR"
          printf '%s' "$ASC_API_PRIVATE_KEY_BASE64" | base64 -D > "$API_KEY_PATH"
          chmod 600 "$API_KEY_PATH"

          IPA_PATH="$(find "$RUNNER_TEMP/export" -maxdepth 1 -name '*.ipa' -print -quit)"
          xcrun altool \
            --upload-app \
            -f "$IPA_PATH" \
            -t ios \
            --apiKey "$ASC_API_KEY_ID" \
            --apiIssuer "$ASC_API_ISSUER_ID" \
            --output-format json
