<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>小小涂色家 - 技术支持</title>
  <style>
    body{margin:0;background:#faf8f3;color:#55483e;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;line-height:1.75}
    main{max-width:760px;margin:auto;padding:56px 24px 80px}
    h1{font-size:34px;margin:0 0 8px;color:#6d855f}h2{font-size:20px;margin-top:34px}
    .meta{color:#9b907f}.card{background:#eef2e8;border-radius:16px;padding:18px 20px}
    a{color:#718d62}
  </style>
</head>
<body>
<main>
  <h1>小小涂色家技术支持</h1>
  <p class="meta">适用于 macOS 和 iOS 版本</p>
  <div class="card">免费 · 完全离线 · 无广告 · 无账号 · 无内购</div>
  <h2>怎么玩</h2>
  <p>选择一本画册和一张喜欢的图，再从右侧选择颜色并点击画面中的色块。也可以在“照样闯关”中参照范例完成图案。</p>
  <h2>作品保存在哪里</h2>
  <p>进度会自动留在当前设备。点击“保存作品”可以调用系统保存或分享面板；保存为 PNG 后即可在“文件”或“照片”中找到。</p>
  <h2>换设备后进度不见了吗</h2>
  <p>不会自动同步。本应用不收集数据，也不使用云存档；删除应用或清理其数据会移除本机进度。</p>
  <h2>联系支持</h2>
  <p>请在 <a href="https://github.com/qq1592263515/little-colorist-support/issues">GitHub Issues</a> 提交问题，附上设备型号、系统版本和问题描述。</p>
</main>
</body>
</html>
